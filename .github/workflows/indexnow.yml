name: IndexNow

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '**/index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Notify IndexNow about changed pages
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node .github/scripts/submit-indexnow.mjs
