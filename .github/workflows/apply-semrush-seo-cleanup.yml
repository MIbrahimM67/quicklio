name: Apply Semrush SEO cleanup
"on":
  push:
    branches:
      - fix/semrush-seo-cleanup
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/semrush-seo-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply cleanup
        run: node scripts/apply-semrush-seo-cleanup.mjs
      - name: Run unit and SEO tests
        run: npm test
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix Semrush SEO findings and PDF to Word layout"
          git push origin HEAD:fix/semrush-seo-cleanup
