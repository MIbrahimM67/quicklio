name: Finalize PDF to Word on-page SEO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Create SEO branch and apply final keyword map
        shell: bash
        run: |
          git checkout -b seo/pdf-to-word-final-map
          python3 - <<'PY'
          from pathlib import Path
          p=Path('en/pdf/pdf-to-word/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>PDF to Word Converter – Free, Private, No Upload | Quicklio</title>','<title>PDF to Word Converter – Free, Editable DOCX & OCR | Quicklio</title>')
          s=s.replace('<meta name="description" content="Convert PDF to editable Word DOCX in your browser. Free, private, no signup or watermark. Page ranges, scan detection, optional on-device OCR, and text preview.">','<meta name="description" content="Convert PDF to editable Word DOCX free in your browser. Supports scanned PDFs with optional OCR, page ranges, text preview, and no upload to Quicklio.">')
          s=s.replace('<meta property="og:title" content="PDF to Word Converter – Private, Browser-Only DOCX">','<meta property="og:title" content="PDF to Word Converter – Free, Editable DOCX & OCR">')
          s=s.replace('<meta property="og:description" content="Turn selectable-text PDFs into editable DOCX files without uploading your document.">','<meta property="og:description" content="Convert text or scanned PDFs into editable Word DOCX files in your browser with optional OCR and no upload to Quicklio.">')
          s=s.replace('"description":"Convert PDF files to editable Word DOCX files locally in the browser with page ranges, scan detection, optional OCR, and a text preview."','"description":"Convert PDF files to editable Word DOCX files in the browser with page ranges, scanned-PDF detection, optional OCR, text preview, and no upload to Quicklio."')
          s=s.replace('<section class="pdfword-hero"><div class="eyebrow">PDF & print · conversion</div><h1>PDF to Word Converter</h1><p>Convert a PDF into an <strong>editable Word (.docx)</strong> file without uploading the document to Quicklio. Preview the extracted text first, choose page ranges, and optionally run on-device OCR on scanned pages.</p></section>','<section class="pdfword-hero"><div class="eyebrow">PDF & print · conversion</div><h1>PDF to Word Converter</h1><p>Convert PDF to an <strong>editable Word (.docx)</strong> file free in your browser. Quicklio supports selectable-text PDFs and scanned PDFs with optional on-device OCR, plus page ranges and a text preview before download.</p></section>')
          old='''    <article class="content-card"><h2>Text PDF vs scanned PDF</h2><p>If you can select the words in your PDF, Quicklio can usually extract that text directly. A scanned PDF may contain only page images, which means there is no editable text to recover directly. The analyzer identifies scan-like pages. If you enable OCR, Quicklio renders those pages locally and uses on-device English OCR to recover editable text.</p><p>If you actually need page images instead of editable text, use <a href="/en/pdf/pdf-to-jpg/">PDF to JPG</a>.</p></article>'''
          new='''    <article class="content-card"><h2>Convert scanned PDF to Word with OCR</h2><p>If you can select the words in your PDF, Quicklio can usually extract that text directly. A scanned PDF may contain only page images, so there is no editable text to recover until OCR is used. Quicklio detects scan-like pages and, when you enable OCR, renders those pages locally and runs on-device English OCR to create editable Word text.</p><p>This makes the same converter useful for both normal PDFs and many scanned PDF-to-Word jobs. OCR accuracy depends on scan quality, language, handwriting, and page layout, so review important text after conversion. If you actually need page images instead of editable text, use <a href="/en/pdf/pdf-to-jpg/">PDF to JPG</a>.</p></article>'''
          if old not in s: raise SystemExit('scanned block not found')
          s=s.replace(old,new,1)
          old='''    <article class="content-card"><h2>What the DOCX keeps</h2><ul><li>Editable text instead of page screenshots.</li><li>Paragraph grouping and likely headings.</li><li>Basic bold/italic signals when the PDF exposes usable font information.</li><li>Page breaks for the selected PDF pages.</li></ul><p>Images, complex tables, columns, forms, and exact spacing are simplified. Review important documents after conversion.</p></article>'''
          new='''    <article class="content-card"><h2>Make PDF text editable in Word</h2><p>The converter builds a real DOCX with editable text rather than placing screenshots of every PDF page into Word. That means you can change sentences, delete paragraphs, add new text, and continue editing the converted document.</p><ul><li>Editable text instead of page screenshots.</li><li>Paragraph grouping and likely headings.</li><li>Basic bold/italic signals when the PDF exposes usable font information.</li><li>Page breaks for the selected PDF pages.</li></ul><p>Images, complex tables, columns, forms, and exact spacing are simplified. Review important documents after conversion.</p></article>'''
          if old not in s: raise SystemExit('editable block not found')
          s=s.replace(old,new,1)
          marker='''    <article class="content-card"><h2>Use page ranges for large PDFs</h2><p>You do not have to convert the whole file. Enter a page range such as <strong>1-8</strong> or <strong>2,5,10-14</strong> to create a smaller Word document from only the pages you need. This is especially useful for reports, manuals, books, and long application packs.</p><p>If file size is the real problem instead, try <a href="/en/pdf/compress-pdf/">Compress PDF</a>.</p></article>'''
          faq='''    <article class="content-card"><h2>PDF to Word questions</h2><h3>Is this PDF to Word converter free?</h3><p>Yes. You can convert supported PDFs to DOCX without creating an account, entering an email address, or paying Quicklio for the conversion.</p><h3>Can I convert a scanned PDF to editable Word?</h3><p>Yes, for many scans. Enable <strong>OCR scanned pages</strong> before analysis. Quicklio runs English OCR in the browser and adds the recovered text to the DOCX.</p><h3>Can I edit the Word file after conversion?</h3><p>Yes. The output is a real <strong>.docx</strong> document with editable text. Complex tables, columns, forms, images, and exact spacing may still need cleanup.</p><h3>Does Quicklio upload my PDF?</h3><p>No conversion upload is required. Parsing, scan detection, OCR when enabled, and DOCX creation happen in your browser.</p></article>'''
          if marker not in s: raise SystemExit('page ranges block not found')
          s=s.replace(marker,marker+'\n'+faq,1)
          p.write_text(s,encoding='utf-8')

          t=Path('tests/seo.test.mjs')
          q=t.read_text(encoding='utf-8')
          guard="""

test('PDF to Word keeps the validated keyword map on one canonical page',()=>{
  const html=fs.readFileSync('en/pdf/pdf-to-word/index.html','utf8').toLowerCase();
  assert.match(html,/<title>[^<]*pdf to word converter/);
  assert.match(html,/convert scanned pdf to word with ocr/);
  assert.match(html,/make pdf text editable in word/);
  assert.match(html,/is this pdf to word converter free\?/);
  assert.match(html,/does quicklio upload my pdf\?/);
  assert.ok(!sitemap.includes('pdf-to-word-online'),'Do not split PDF to Word synonyms into doorway URLs');
  assert.ok(!sitemap.includes('pdf-to-docx'),'Do not split PDF to DOCX into a duplicate tool URL');
});
"""
          if 'PDF to Word keeps the validated keyword map' not in q:
              q += guard
              t.write_text(q,encoding='utf-8')
          PY
          npm test
          git add en/pdf/pdf-to-word/index.html tests/seo.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize PDF to Word keyword map"
          git push origin seo/pdf-to-word-final-map
